name: Deploy to GitHub Pages

on:
  push:
    branches: [001-physical-ai-book, 002-rag-chatbot]
  pull_request:
    branches: [001-physical-ai-book]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          NEON_AUTH_URL: ${{ secrets.NEON_AUTH_URL }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}

      - name: Validate content
        run: node scripts/validate-content.js

      - name: Performance check
        run: node scripts/monitor-performance.js

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/001-physical-ai-book'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
